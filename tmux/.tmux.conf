# More convenient prefix: Ctrl-a instead of Ctrl-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support, one-based window indexes, and a larger scrollback buffer
set-option -g mouse on
set-option -g base-index 1
set-option -g history-limit 100000

# Fast splits and pane navigation
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload the configuration with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Search and switch tmux sessions with sesh and fzf
bind s run-shell 'sesh connect "$(sesh list | fzf-tmux -p 80%,70%)"'

# Use vi-style navigation in copy mode
setw -g mode-keys vi

# Plugins and status line
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_left_separator '|'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator '|'
set -g @catppuccin_window_current_left_separator '|'
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator '|'
set -g @catppuccin_window_flags 'text'
set -g @catppuccin_status_left_separator '['
set -g @catppuccin_status_middle_separator ' '
set -g @catppuccin_status_right_separator ']'
set -g @catppuccin_status_fill 'text'
set -g status-position top
set -g status-right 'BAT #{battery_percentage} | CPU #{cpu_percentage} | %a %d %b %H:%M'

run '~/.tmux/plugins/tpm/tpm'
